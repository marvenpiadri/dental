<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dontalist</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.ico"><link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="color-scheme" content="light dark">
  <script>
    // Applies the saved appearance before the first paint so the page never flashes the wrong theme.
    try { var t = localStorage.getItem('ds-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <ds-root></ds-root>
</body>
</html>
