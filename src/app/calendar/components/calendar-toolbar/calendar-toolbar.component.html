<div class="bar">
  <div class="left">
    <button type="button" class="icon-btn menu" [attr.aria-label]="t('cal.sidebar')" (click)="toggleSidebar.emit()">
      <cal-icon name="menu" [size]="18" />
    </button>
    <button type="button" class="new-btn" [title]="newLabel() + ' (N)'" (click)="newEvent.emit()">
      <cal-icon name="plus" [size]="16" [stroke]="2.4" />
      <span class="new-label">{{ newLabel() }}</span>
    </button>
  </div>

  <div class="segmented" role="tablist" [attr.aria-label]="t('cal.view')">
    @for (v of views; track v.id) {
      <button
        type="button"
        role="tab"
        class="seg"
        [class.active]="store.view() === v.id"
        [attr.aria-selected]="store.view() === v.id"
        (click)="store.setView(v.id)"
      >
        {{ t(v.key) }}
      </button>
    }
  </div>

  <div class="right">
    <!-- host apps can project extra controls here (group by, filters...) -->
    <ng-content />
    <label class="search">
      <cal-icon name="search" [size]="15" />
      <input
        type="search"
        [placeholder]="searchPlaceholder()"
        [attr.aria-label]="searchPlaceholder()"
        [value]="store.search()"
        (input)="onSearch($event)"
      />
    </label>
  </div>
</div>

<div class="heading">
  <h1 class="title">{{ store.title() }}</h1>
  <div class="nav">
    <button type="button" class="nav-btn square" [attr.aria-label]="t('cal.prev')" (click)="store.prev()">
      <cal-icon name="chevron-left" [size]="16" />
    </button>
    <button type="button" class="nav-btn today" (click)="store.goToday()">{{ t('cal.today') }}</button>
    <button type="button" class="nav-btn square" [attr.aria-label]="t('cal.next')" (click)="store.next()">
      <cal-icon name="chevron-right" [size]="16" />
    </button>
  </div>
</div>
