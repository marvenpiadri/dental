<main class="app-shell" [class.dark]="dark()">
  <nav class="module-rail" aria-label="Main navigation">
    <a class="brand-mark" href="/" aria-label="Denteus home">D<span>.</span></a>
    <div class="rail-divider"></div>
    <button class="rail-item" [class.active]="page() === 'calendar'" type="button" [attr.aria-current]="page() === 'calendar' ? 'page' : null" aria-label="Calendar" title="Calendar" (click)="navigate('calendar')">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5"></rect><path d="M7.5 3.5v3M16.5 3.5v3M3.5 9.5h17M8 13h2M14 13h2M8 16.5h2"></path></svg>
    </button>
    <button class="rail-item" [class.active]="page() === 'patients'" type="button" [attr.aria-current]="page() === 'patients' ? 'page' : null" aria-label="Patients" title="Patients" (click)="navigate('patients')">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"></circle><path d="M3.5 19v-1.2a5.5 5.5 0 0 1 11 0V19zM16 5.2a3 3 0 0 1 0 5.7M17 13.5a4.7 4.7 0 0 1 3.5 4.5V19h-3"></path></svg>
    </button>
  </nav>
  <section class="workspace" aria-label="Clinic workspace">
    @if (page() === 'calendar') {
      <den-calendar class="calendar" (themeChange)="onTheme($event)" (openPatient)="onOpenPatient($event)" (openEncounter)="onOpenEncounter($event)" />
    } @else {
      <den-patient-workspace />
    }
  </section>
</main>
