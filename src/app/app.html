<main class="app-shell" [class.dark]="dark()">
  <nav class="module-rail" aria-label="Main navigation">
    <a class="brand-mark" href="/" aria-label="Dental home">D<span>.</span></a>

    <div class="rail-divider"></div>

    <button class="rail-item active" type="button" aria-current="page" aria-label="Calendar" title="Calendar">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3.5" y="5" width="17" height="15.5" rx="0"></rect>
        <path d="M7.5 3.5v3M16.5 3.5v3M3.5 9.5h17M8 13h2M14 13h2M8 16.5h2"></path>
      </svg>
    </button>
  </nav>

  <section class="workspace" aria-label="Clinic workspace">
    <den-calendar
      class="calendar"
      (themeChange)="onTheme($event)"
      (openPatient)="onOpenPatient($event)"
      (openEncounter)="onOpenEncounter($event)"
    />
  </section>
</main>
