<div class="app-shell">
  <nav class="rail" [attr.aria-label]="t('nav.main')">
    <a class="brand" routerLink="/today" [attr.aria-label]="t('app.home')">D<span>.</span></a>

    <a class="item" routerLink="/today" routerLinkActive="active" ariaCurrentWhenActive="page">
      <i class="fa-solid fa-table-cells-large" aria-hidden="true"></i>
      <span>{{ t('nav.today') }}</span>
    </a>
    <a class="item" routerLink="/calendar" routerLinkActive="active" ariaCurrentWhenActive="page">
      <i class="fa-regular fa-calendar-days" aria-hidden="true"></i>
      <span>{{ t('nav.calendar') }}</span>
    </a>
    <a class="item" routerLink="/patients" routerLinkActive="active" ariaCurrentWhenActive="page">
      <i class="fa-solid fa-user-group" aria-hidden="true"></i>
      <span>{{ t('nav.patients') }}</span>
    </a>

    <a class="item" routerLink="/setup" routerLinkActive="active" ariaCurrentWhenActive="page">
      <i class="fa-solid fa-gear" aria-hidden="true"></i>
      <span>{{ t('nav.setup') }}</span>
    </a>

    <div class="tools">
      <button class="item" type="button" (click)="i18n.setLang(nextLang())" [attr.aria-label]="t('nav.language') + ': ' + nextLangLabel()" [attr.title]="nextLangLabel()">
        <i class="fa-solid fa-globe" aria-hidden="true"></i>
        <span>{{ nextLangShort() }}</span>
      </button>
      <!-- Both icons are always in the markup; CSS shows one. The server can't know the system theme. -->
      <button class="item theme" type="button" (click)="themeService.toggle()" [attr.aria-label]="themeService.theme() === 'dark' ? t('theme.toLight') : t('theme.toDark')">
        <i class="fa-regular fa-moon icon-to-dark" aria-hidden="true"></i>
        <i class="fa-regular fa-sun icon-to-light" aria-hidden="true"></i>
      </button>
    </div>
  </nav>

  <main class="workspace">
    <router-outlet />
  </main>
</div>
